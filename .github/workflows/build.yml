name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-3ds:
    name: Build .3dsx (devkitARM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          make
          ls -la *.3dsx *.smdh

      - name: Upload .3dsx artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-zip-extractor-3dsx
          path: |
            *.3dsx
            *.smdh
          if-no-files-found: error

  host-tests:
    name: Host unit tests (ASAN/UBSAN)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Run host tests with sanitizers
        run: make -C tests -f Makefile.host test-asan

  release:
    name: Publish GitHub Release
    needs: [build-3ds, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: 3ds-zip-extractor-3dsx
          path: dist/

      - name: Pick release notes
        id: notes
        run: |
          tag="${GITHUB_REF##refs/tags/}"
          file="docs/release-notes/RELEASE_NOTES_${tag}.md"
          if [ -f "$file" ]; then
            echo "Using release notes from $file"
            echo "body_path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "No tagged notes file ($file); will fall back to auto-generated."
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (with curated notes)
        if: steps.notes.outputs.body_path != ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.3dsx
            dist/*.smdh
          body_path: ${{ steps.notes.outputs.body_path }}

      - name: Create Release (auto-generated notes)
        if: steps.notes.outputs.body_path == ''
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.3dsx
            dist/*.smdh
          generate_release_notes: true
